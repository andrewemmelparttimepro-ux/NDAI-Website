<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Experience — ND.AI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#080808}
  iframe{
    position:fixed;inset:0;
    width:100%;height:100%;
    border:none;
    display:block;
  }
  #back{
    position:fixed;top:20px;left:24px;z-index:9999;
    font-family:system-ui,sans-serif;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.35);
    text-decoration:none;
    transition:color .2s;
    cursor:pointer;
  }
  #back:hover{color:rgba(255,255,255,.8)}
</style>
</head>
<body>
  <a id="back" href="javascript:history.back()">← Back</a>
  <iframe src="/good-design.html" allowfullscreen></iframe>
</body>
</html>
